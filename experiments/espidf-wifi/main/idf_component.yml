dependencies:
  # The ESP32-P4 has no radio. esp_wifi_remote supplies the esp_wifi API and
  # esp_hosted carries it over SDIO to the onboard ESP32-C6.
  #
  # These two must be paired. esp_hosted's own Kconfig turns itself off when
  # CONFIG_ESP_HOST_WIFI_ENABLED is set, and on when esp_wifi_remote selects
  # the hosted library, so the two mechanisms are mutually exclusive.
  #
  # The versions match what Waveshare pins for ESP-IDF 5.x in its own working
  # ESP32-P4 Wi-Fi example, at
  # https://github.com/waveshareteam/esp32-p4-platform. Newer host generations,
  # 2.7.4 and 3.0.6, both fail to enumerate the C6 on this board, and the
  # factory slave firmware is old enough that an older host is the better match.
  espressif/esp_wifi_remote: "0.14.*"
  espressif/esp_hosted: "1.4.*"
