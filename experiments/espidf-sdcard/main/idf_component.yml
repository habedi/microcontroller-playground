dependencies:
  # Wi-Fi remote proxy over SDIO to onboard C6
  espressif/esp_wifi_remote:
    version: "*"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_hosted:
    # Keep dependency rules aligned with the locked component's Kconfig.
    version: "3.0.10"
    rules:
      - if: "target in [esp32p4]"

  # LittleFS filesystem on internal flash
  joltwallet/littlefs: "^1.14.0"
