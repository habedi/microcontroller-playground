name: Tests

on:
  workflow_dispatch:
  schedule: # Run every day at midnight (UTC)
    - cron: '0 0 * * *'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the Python tools
        run: make install

      - name: Run the Git hooks on all files
        run: make test-hooks

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Evaluate the Nix flake
        run: nix flake check --no-build

  # Builds NuttX images for configured boards to verify build pipeline.
  nuttx-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Pico 2
            board: raspberrypi-pico-2:nsh
          - name: ESP32-P4
            board: esp32p4-function-ev-board:nsh
    name: nuttx-build (${{ matrix.name }})
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system dependencies
        run: make setup-deps

      # Pinned GCC 14 toolchain with newlib required for ESP32-P4 HAL.
      - name: Install the Espressif RISC-V toolchain
        if: matrix.name == 'ESP32-P4'
        env:
          RELEASE: esp-14.2.0_20260121
          ARCHIVE: riscv32-esp-elf-14.2.0_20260121-x86_64-linux-gnu.tar.xz
        run: |
          curl -fsSL -o toolchain.tar.xz \
            "https://github.com/espressif/crosstool-NG/releases/download/${RELEASE}/${ARCHIVE}"
          mkdir -p "${HOME}/toolchain"
          tar -xf toolchain.tar.xz -C "${HOME}/toolchain"
          echo "${HOME}/toolchain/riscv32-esp-elf/bin" >> "${GITHUB_PATH}"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the Python tools
        run: make install

      - name: Configure and build NuttX for the ${{ matrix.name }}
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/external/pico-sdk
        run: |
          make nuttx-configure BOARD=${{ matrix.board }}
          uv run make nuttx-build

      - name: Upload NuttX firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuttx-${{ matrix.name }}
          path: |
            external/nuttx/nuttx.bin
            external/nuttx/nuttx.uf2
          if-no-files-found: warn

  # Builds ESP-IDF images for target boards and publishes binaries.
  espidf-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: espidf-sdcard
            dir: experiments/espidf-sdcard
            target: esp32p4
          - name: espidf-c6-slave
            dir: experiments/espidf-c6-slave
            target: esp32c6
          - name: espidf-hello
            dir: experiments/espidf-hello
            target: esp32p4
    name: espidf-build (${{ matrix.name }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mark workspace directory as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build ESP-IDF firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -C ${{ matrix.dir }} -B build/${{ matrix.name }} set-target ${{ matrix.target }} build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ matrix.target }}
          path: |
            build/${{ matrix.name }}/bootloader/bootloader.bin
            build/${{ matrix.name }}/partition_table/partition-table.bin
            build/${{ matrix.name }}/*.bin
            build/${{ matrix.name }}/flasher_args.json
          if-no-files-found: error
