name: Tests

on:
  workflow_dispatch:
  schedule: # Run every day at midnight (UTC)
    - cron: '0 0 * * *'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Repository checks: the Git hooks and the Nix flake.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the Python tools
        run: make install

      - name: Run the Git hooks on all files
        run: make test-hooks

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Evaluate the Nix flake
        run: nix flake check --no-build

  # NuttX builds with the apt toolchains. They prove the submodules, the
  # system dependencies, and the build flow stay working. Ubuntu ships
  # gcc-riscv64-unknown-elf with the rv32imac soft-float multilib the
  # Espressif boards need, under the name their board configuration asks for,
  # so no toolchain override belongs here. The boards themselves are not in
  # CI, so nothing is flashed or run.
  nuttx-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Pico 2
            board: raspberrypi-pico-2:nsh
          - name: ESP32-P4
            board: esp32p4-function-ev-board:nsh
    name: nuttx-build (${{ matrix.name }})
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system dependencies
        run: make setup-deps

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the Python tools
        run: make install

      - name: Configure and build NuttX for the ${{ matrix.name }}
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/external/pico-sdk
        run: |
          make nuttx-configure BOARD=${{ matrix.board }}
          uv run make nuttx-build
